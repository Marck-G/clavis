[package]
name = "clavis"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
tokio = { version = "1", features = ["full"] }
ldap3 = "0.12.1"
tower = "0.5.3"
tower-sessions = "0.15"
tower-http = { version = "0.6.8", features = ["fs", "cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

bcrypt = "0.18"
md-5 = "0.10"
md4 = "0.10"
lettre = { version = "0.11.19", features = ["tokio1-native-tls", "tracing"] }
